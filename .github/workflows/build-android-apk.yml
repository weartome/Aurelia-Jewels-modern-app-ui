name: Build Aurelia Jewels Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Create a GitHub Release with direct APK download link"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag name (used only if Publish Release is checked)"
        required: false
        default: "v1.0.0-demo"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Test and Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36.1 + Build-Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${SDK_DIR}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under ${SDK_DIR}"
            ls -la "${SDK_DIR}" || true
            exit 1
          fi

          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "$SDKMANAGER" --sdk_root="${SDK_DIR}" --licenses > /dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="${SDK_DIR}" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0"

          if [ ! -d "${SDK_DIR}/platforms/android-36.1" ]; then
            echo "ERROR: Required Android platform android-36.1 was not installed."
            ls -la "${SDK_DIR}/platforms" || true
            exit 1
          fi

          echo "Verified Android SDK platforms:"
          ls -la "${SDK_DIR}/platforms"
          echo "Verified Android SDK build-tools:"
          ls -la "${SDK_DIR}/build-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Ensure gradlew permissions if wrapper script exists
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          fi
          gradle --version

      - name: Cache Robolectric Android runtime JARs
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-sdk36-v1
          restore-keys: |
            robolectric-android-all-

      - name: Prepare and verify debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Decoded debug.keystore from debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated fallback debug.keystore"
            fi
          fi

          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Run unit tests
        shell: bash
        run: |
          gradle :app:testDebugUnitTest \
            -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2 \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          gradle :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            --stacktrace

      - name: Verify and package Debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: APK missing or empty at ${APK_PATH}"
            exit 1
          fi

          keytool -printcert -jarfile "$APK_PATH" | head -n 20

          mkdir -p release-apk
          cp "$APK_PATH" release-apk/Aurelia-Jewels-debug.apk
          ls -lh release-apk/Aurelia-Jewels-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurelia-Jewels-APK
          path: release-apk/Aurelia-Jewels-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release with direct APK download
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
          name: Aurelia Jewels Android Demo (${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }})
          body: |
            Automated Android Debug APK build for **Aurelia Jewels**.

            ### How to install on Android
            1. Download `Aurelia-Jewels-debug.apk` from the Assets section below.
            2. Open the downloaded file on your Android phone.
            3. If prompted, enable **Install unknown apps** for your browser or file manager.
            4. Tap **Install** and open **Aurelia Jewels**.

            *Note: This is a local demo prototype using on-device Room SQLite storage. Payments are simulated and no live charges occur.*
          files: release-apk/Aurelia-Jewels-debug.apk
          prerelease: true
